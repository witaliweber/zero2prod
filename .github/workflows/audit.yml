name: Security Audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"

jobs:
  secuity_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: carg install cargo-audit
      - name: Run cargo audit
        run: cargo audit